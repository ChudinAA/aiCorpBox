  template:
    metadata:
      labels:
        {{- include "aibox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rag
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: rag
        image: "{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.rag.image.repository | default "aibox-rag" }}:{{ .Values.rag.image.tag | default $imageTag }}"
        imagePullPolicy: {{ .Values.rag.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.rag.service.port }}
          protocol: TCP
        env:
        - name: PORT
          value: "{{ .Values.rag.service.port }}"
        - name: POSTGRES_HOST
          value: "{{ include "aibox.fullname" . }}-postgresql"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.auth.database }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "aibox.fullname" . }}-secrets
              key: postgres-password
        - name: QDRANT_HOST
          value: "{{ include "aibox.fullname" . }}-qdrant"
        - name: QDRANT_PORT
          value: "{{ .Values.qdrant.service.port }}"
        - name: OLLAMA_HOST
          value: "{{ include "aibox.fullname" . }}-ollama"
        - name: OLLAMA_PORT
          value: "{{ .Values.ollama.service.port }}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          {{- toYaml .Values.rag.resources | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
---
