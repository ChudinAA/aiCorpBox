---
# Monitoring Deployment (Prometheus with custom config)
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aibox.fullname" . }}-prometheus
  labels:
    {{- include "aibox.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aibox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "aibox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: prometheus
        image: "{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.monitoring.image.repository | default "aibox-monitoring" }}:{{ .Values.monitoring.image.tag | default $imageTag }}"
        imagePullPolicy: {{ .Values.monitoring.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--web.console.libraries=/etc/prometheus/console_libraries"
        - "--web.console.templates=/etc/prometheus/consoles"
        - "--web.enable-lifecycle"
        - "--storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}"
        volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
      volumes:
      - name: prometheus-storage
        emptyDir: {}
{{- end }}